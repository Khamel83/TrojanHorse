name: work-corpus CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,documents]"
      - name: Run active tests
        run: python -m pytest -q
      - name: Check Python syntax and undefined names
        run: python -m ruff check work-corpus/src work-corpus/tests
      - name: Check patch whitespace
        run: git diff --check
