[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trojanhorse-work-corpus"
version = "2.0.0"
description = "Local-first work evidence corpus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
documents = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Khamel83/TrojanHorse"
Repository = "https://github.com/Khamel83/TrojanHorse"

[project.scripts]
work-corpus = "work_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "work-corpus/src"}

[tool.setuptools.packages.find]
where = ["work-corpus/src"]

[tool.pytest.ini_options]
testpaths = ["work-corpus/tests"]
pythonpath = ["work-corpus/src"]
addopts = [
    "--cov=work_corpus",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["work_corpus"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
