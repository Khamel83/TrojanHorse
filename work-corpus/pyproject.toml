[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omar-work-corpus"
version = "1.0.0"
description = "Local-first work evidence corpus bootstrap"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
work-corpus = "work_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
