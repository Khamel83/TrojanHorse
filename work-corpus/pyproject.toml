[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omar-work-corpus"
version = "1.0.0"
description = "Local-first work evidence corpus bootstrap"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
documents = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
work-corpus = "work_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
